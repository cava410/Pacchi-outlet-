<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pacchi Outlet</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:linear-gradient(135deg,#0f172a,#1e293b);
    color:white;
    min-height:100vh;
}

.header{
    text-align:center;
    padding:40px 20px;
}

.logo{
    font-size:80px;
}

h1{
    margin-top:10px;
    font-size:36px;
}

.subtitle{
    opacity:0.85;
    margin-top:10px;
    font-size:18px;
}

.hero{
    display:flex;
    justify-content:center;
    padding:30px;
}

.card{
    width:350px;
    background:white;
    color:#111;
    border-radius:25px;
    padding:20px;
    box-shadow:0 10px 30px rgba(0,0,0,0.3);
}

.product-image{
    width:100%;
    height:200px;
    border-radius:15px;
    background:linear-gradient(135deg,#f59e0b,#f97316);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:90px;
}

.card h2{
    margin-top:15px;
}

.price{
    color:#16a34a;
    font-size:32px;
    font-weight:bold;
    margin-top:10px;
}

.description{
    color:#555;
    margin-top:10px;
    line-height:1.5;
}

.call-btn{
    position:fixed;
    bottom:25px;
    right:25px;
    width:80px;
    height:80px;
    border:none;
    border-radius:50%;
    background:#22c55e;
    color:white;
    font-size:36px;
    cursor:pointer;
    box-shadow:0 0 25px rgba(34,197,94,0.7);
    transition:.3s;
}

.call-btn:hover{
    transform:scale(1.1);
}

.contact-text{
    position:fixed;
    bottom:115px;
    right:20px;
    background:white;
    color:black;
    padding:8px 12px;
    border-radius:12px;
    font-size:14px;
}
</style>

</head>
<body>

<div class="header">
    <div class="logo">📦</div>
    <h1>PACCHI OUTLET</h1>
    <p class="subtitle">Stock e lotti disponibili a prezzo scontato</p>
</div>

<div class="hero">
    <div class="card">
        <div class="product-image">📦</div>

        <h2>Lotto Misterioso</h2>

        <div class="price">€4,99</div>

        <p class="description">
            Scopri articoli provenienti da stock e liquidazioni.
            Disponibilità limitata.
        </p>
    </div>
</div>

<div class="contact-text">
    Contatta il venditore
</div>

<button class="call-btn" onclick="contatta()">
📞
</button>

<script>
function contatta(){
    window.location.href = "tel:+391234567890";
}
</script>

</body>
</html>
